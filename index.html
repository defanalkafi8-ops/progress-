<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dari Sarul - Special Arcade & Messages</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Outfit:wght@400;600;800&display=swap');

        .font-pixel { font-family: 'Press Start 2P', cursive; }
        .font-sans { font-family: 'Outfit', sans-serif; }

        /* CRT Overlay & Arcade Glow */
        .crt-overlay::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 50;
            background-size: 100% 3px, 6px 100%;
            pointer-events: none;
            opacity: 0.5;
        }

        .neon-text-pink {
            text-shadow: 0 0 10px rgba(236, 72, 153, 0.8), 0 0 20px rgba(236, 72, 153, 0.5);
        }
        .neon-box-pink {
            box-shadow: 0 0 20px rgba(236, 72, 153, 0.3), inset 0 0 15px rgba(236, 72, 153, 0.1);
        }

        /* Cursor blink for typing effect */
        .cursor-blink::after {
            content: '|';
            animation: blink 1s infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col justify-between crt-overlay select-none relative overflow-x-hidden">

    <header class="p-4 md:p-6 flex justify-between items-center z-10 border-b border-slate-800 bg-slate-900/60 backdrop-blur-md">
        <div class="flex items-center gap-3 cursor-pointer" onclick="showScreen('dialog-screen')">
            <i class="fa-solid fa-heart text-pink-500 text-xl animate-pulse"></i>
            <span class="font-pixel text-xs md:text-sm text-transparent bg-clip-text bg-gradient-to-r from-pink-500 via-purple-400 to-cyan-400">SARUL'S ARCADE</span>
        </div>
        <div class="flex items-center gap-3">
            <button id="sound-btn" onclick="toggleSound()" class="p-2 px-3 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 transition text-xs flex items-center gap-2">
                <i id="sound-icon" class="fa-solid fa-volume-high text-pink-400"></i>
                <span id="sound-text" class="hidden md:inline font-semibold">SUARA: ON</span>
            </button>
            <button onclick="showScreen('game-menu')" id="hub-btn" class="hidden p-2 px-4 rounded-xl bg-pink-600 hover:bg-pink-500 text-white font-semibold transition text-xs flex items-center gap-2 shadow-lg shadow-pink-600/30">
                <i class="fa-solid fa-gamepad"></i> Game Hub
            </button>
        </div>
    </header>

    <main class="flex-grow flex items-center justify-center p-4 relative z-10 my-4">

        <!-- ================= DIALOG INTRO SCREEN ================= -->
        <section id="dialog-screen" class="w-full max-w-lg bg-slate-900/90 border border-pink-500/30 rounded-3xl p-6 md:p-8 neon-box-pink backdrop-blur-md flex flex-col items-center text-center">
            
            <div class="w-20 h-20 rounded-full bg-pink-500/10 border-2 border-pink-500/40 flex items-center justify-center text-pink-400 text-3xl mb-6 shadow-lg shadow-pink-500/20">
                <i class="fa-solid fa-envelope-open-text animate-bounce"></i>
            </div>

            <!-- Typing Box -->
            <div class="min-h-[140px] w-full bg-slate-950/80 border border-slate-800 rounded-2xl p-5 mb-6 flex items-center justify-center">
                <p id="typing-text" class="font-pixel text-sm md:text-base text-pink-300 leading-relaxed cursor-blink"></p>
            </div>

            <!-- Interactive Choice Buttons -->
            <div id="choice-buttons" class="hidden flex-col sm:flex-row gap-4 w-full">
                <button onclick="handleChoice('garing')" class="flex-1 py-3.5 px-6 rounded-2xl bg-slate-800 hover:bg-slate-700 border border-slate-700 font-pixel text-xs text-slate-300 transition hover:scale-105 active:scale-95 shadow-lg">
                    😅 Garing
                </button>
                <button onclick="handleChoice('love')" class="flex-1 py-3.5 px-6 rounded-2xl bg-gradient-to-r from-pink-600 to-purple-600 hover:from-pink-500 hover:to-purple-500 font-pixel text-xs text-white transition hover:scale-105 active:scale-95 shadow-lg shadow-pink-600/30">
                    💖 I Love You Too
                </button>
            </div>

            <!-- Anonymous Comment Form Modal (Keyboard Auto-Focus On Mobile) -->
            <div id="comment-modal" class="hidden w-full mt-4 bg-slate-950 border border-slate-800 rounded-2xl p-4 text-left">
                <p class="text-xs text-pink-400 font-semibold mb-2"><i class="fa-solid fa-comment-dots"></i> Pesan anonim kamu untuk Sarul:</p>
                <textarea id="comment-input" rows="3" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-xs text-slate-200 focus:outline-none focus:border-pink-500 mb-3 resize-none select-text cursor-text" placeholder="Ketik pesan kamu di sini..."></textarea>
                <button onclick="sendAnonymousComment()" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 font-pixel text-xs text-white rounded-xl transition flex items-center justify-center gap-2">
                    <i class="fa-solid fa-paper-plane"></i> Kirim Pesan
                </button>
            </div>

            <!-- Sweet Auto Response -->
            <div id="love-modal" class="hidden w-full mt-4 bg-pink-950/40 border border-pink-500/40 rounded-2xl p-5 text-center">
                <p class="font-pixel text-xs text-pink-300 mb-3">Aww, makasih beb! 🥰❤️</p>
                <p class="text-xs text-slate-300 mb-4">Pesan kamu sudah kesimpan. Sekarang yuk main game bareng!</p>
                <button onclick="showScreen('game-menu')" class="w-full py-3 bg-pink-600 hover:bg-pink-500 font-pixel text-xs text-white rounded-xl shadow-lg transition">
                    LANJUT KE MENU GAME <i class="fa-solid fa-arrow-right ml-1"></i>
                </button>
            </div>

        </section>

        <!-- ================= GAME SELECTION MENU ================= -->
        <section id="game-menu" class="hidden w-full max-w-4xl">
            <div class="text-center mb-8">
                <h2 class="font-pixel text-2xl md:text-3xl text-pink-400 mb-2 neon-text-pink">ARCADE MINI GAMES</h2>
                <p class="text-slate-400 text-xs md:text-sm">Pilih game untuk dimainkan!</p>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Tic-Tac-Toe -->
                <div onclick="initTicTacToe(); showScreen('tictactoe-screen')" class="cursor-pointer bg-slate-900/80 border border-slate-800 hover:border-pink-500/50 rounded-3xl p-6 transition flex flex-col justify-between">
                    <div>
                        <div class="w-14 h-14 rounded-2xl bg-pink-500/10 border border-pink-500/30 flex items-center justify-center text-pink-400 text-2xl mb-4">
                            <i class="fa-solid fa-xmark"></i>
                        </div>
                        <h3 class="font-pixel text-base text-white mb-2">Tic-Tac-Toe</h3>
                        <p class="text-slate-400 text-xs">Game Klasik X dan O vs Teman atau AI.</p>
                    </div>
                    <button class="mt-6 w-full py-2.5 rounded-xl bg-pink-600 text-white font-semibold text-xs">Mainkan Sekarang</button>
                </div>
            </div>
        </section>

        <!-- ================= MINI GAME: TIC TAC TOE ================= -->
        <section id="tictactoe-screen" class="hidden w-full max-w-md bg-slate-900/90 border border-slate-800 rounded-3xl p-6 backdrop-blur-md shadow-2xl">
            <div class="flex justify-between items-center mb-4">
                <div>
                    <h2 class="font-pixel text-base text-pink-400">Tic-Tac-Toe</h2>
                    <p id="ttt-status" class="text-xs text-slate-400 mt-1">Giliran: Pemain X</p>
                </div>
                <button onclick="initTicTacToe()" class="p-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs transition">
                    <i class="fa-solid fa-rotate-right"></i> Reset
                </button>
            </div>
            <div id="ttt-board" class="grid grid-cols-3 gap-3 aspect-square mb-4"></div>
        </section>

    </main>

    <script>
        // Dialog Typing Text Data
        const dialogLines = [
            "dari sarul",
            "buah nangka...",
            "buah kedondong...",
            "i love you beb ❤️"
        ];

        let lineIdx = 0;
        let charIdx = 0;
        let isSoundOn = true;

        const typingTextEl = document.getElementById('typing-text');
        const choiceBtns = document.getElementById('choice-buttons');
        const commentModal = document.getElementById('comment-modal');
        const loveModal = document.getElementById('love-modal');

        function playSynthSound(freq = 440, duration = '8n') {
            if (!isSoundOn) return;
            try {
                const synth = new Tone.Synth().toDestination();
                synth.triggerAttackRelease(freq, duration);
            } catch (e) {}
        }

        function typeNextChar() {
            if (lineIdx < dialogLines.length) {
                const currentLine = dialogLines[lineIdx];
                if (charIdx < currentLine.length) {
                    typingTextEl.textContent += currentLine.charAt(charIdx);
                    charIdx++;
                    playSynthSound(300 + (charIdx * 20), '16n');
                    setTimeout(typeNextChar, 80);
                } else {
                    setTimeout(() => {
                        lineIdx++;
                        charIdx = 0;
                        if (lineIdx < dialogLines.length) {
                            typingTextEl.textContent = '';
                            setTimeout(typeNextChar, 400);
                        } else {
                            typingTextEl.classList.remove('cursor-blink');
                            choiceBtns.classList.remove('hidden');
                            choiceBtns.classList.add('flex');
                        }
                    }, 1200);
                }
            }
        }

        function handleChoice(type) {
            choiceBtns.classList.add('hidden');
            if (type === 'garing') {
                commentModal.classList.remove('hidden');
                setTimeout(() => {
                    const input = document.getElementById('comment-input');
                    input.focus();
                }, 100);
            } else if (type === 'love') {
                loveModal.classList.remove('hidden');
                document.getElementById('hub-btn').classList.remove('hidden');
            }
        }

        function sendAnonymousComment() {
            const text = document.getElementById('comment-input').value;
            if (!text.trim()) {
                alert('Tulis pesan terlebih dahulu!');
                return;
            }
            alert('Pesan anonim berhasil dikirim ke Sarul!');
            showScreen('game-menu');
        }

        function showScreen(screenId) {
            const screens = ['dialog-screen', 'game-menu', 'tictactoe-screen'];
            screens.forEach(s => {
                const el = document.getElementById(s);
                if (el) el.classList.add('hidden');
            });
            const activeEl = document.getElementById(screenId);
            if (activeEl) activeEl.classList.remove('hidden');
            if (screenId !== 'dialog-screen') {
                document.getElementById('hub-btn').classList.remove('hidden');
            }
        }

        function toggleSound() {
            isSoundOn = !isSoundOn;
            document.getElementById('sound-text').textContent = isSoundOn ? 'SUARA: ON' : 'SUARA: OFF';
        }

        // Tic Tac Toe Logic
        let tttBoard = Array(9).fill('');
        let tttTurn = 'X';
        let tttActive = true;

        function initTicTacToe() {
            tttBoard = Array(9).fill('');
            tttTurn = 'X';
            tttActive = true;
            document.getElementById('ttt-status').textContent = 'Giliran: Pemain X';
            const boardEl = document.getElementById('ttt-board');
            boardEl.innerHTML = '';
            for (let i = 0; i < 9; i++) {
                const btn = document.createElement('button');
                btn.className = 'bg-slate-950 border border-slate-800 rounded-2xl text-2xl font-pixel flex items-center justify-center text-pink-400 active:scale-95 transition';
                btn.onclick = () => makeMove(i);
                boardEl.appendChild(btn);
            }
        }

        function makeMove(idx) {
            if (!tttActive || tttBoard[idx] !== '') return;
            tttBoard[idx] = tttTurn;
            const btn = document.getElementById('ttt-board').children[idx];
            btn.textContent = tttTurn;
            btn.classList.add(tttTurn === 'X' ? 'text-pink-400' : 'text-cyan-400');

            if (checkWin()) {
                document.getElementById('ttt-status').textContent = `Pemain ${tttTurn} Menang! 🎉`;
                tttActive = false;
                return;
            }
            if (tttBoard.every(cell => cell !== '')) {
                document.getElementById('ttt-status').textContent = 'Hasil Seri! 🤝';
                tttActive = false;
                return;
            }

            tttTurn = tttTurn === 'X' ? 'O' : 'X';
            document.getElementById('ttt-status').textContent = `Giliran: Pemain ${tttTurn}`;
        }

        function checkWin() {
            const wins = [
                [0,1,2], [3,4,5], [6,7,8],
                [0,3,6], [1,4,7], [2,5,8],
                [0,4,8], [2,4,6]
            ];
            return wins.some(w => w.every(i => tttBoard[i] === tttTurn));
        }

        window.onload = () => {
            setTimeout(typeNextChar, 500);
        };
    </script>
</body>
    </html>
